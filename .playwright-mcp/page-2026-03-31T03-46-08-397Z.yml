                - paragraph [ref=e1248]:
                  - strong [ref=e1249]: How is this different from the official docs?
                  - text: The official docs are a feature reference. This guide is a tutorial with diagrams, production-ready templates, and a progressive learning path. They complement each other — start here to learn, reference the docs when you need specifics.
                - paragraph [ref=e1250]:
                  - strong [ref=e1251]: How long does it take to go through everything?
                  - text: 11-13 hours for the full path. But you'll get immediate value in 15 minutes — just copy a slash command template and try it.
                - paragraph [ref=e1252]:
                  - strong [ref=e1253]: Can I use this with Claude Sonnet / Haiku / Opus?
                  - text: Yes. All templates work with Claude Sonnet 4.6, Claude Opus 4.6, and Claude Haiku 4.5.
                - paragraph [ref=e1254]:
                  - strong [ref=e1255]: Can I contribute?
                  - text: Absolutely. See
