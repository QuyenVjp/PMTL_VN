include_patterns:
  - "apps/**/*.ts"
  - "apps/**/*.tsx"
  - "apps/**/*.js"
  - "apps/**/*.jsx"
  - "apps/**/*.json"
  - "apps/**/*.md"
  - "packages/**/*.ts"
  - "packages/**/*.tsx"
  - "packages/**/*.js"
  - "packages/**/*.jsx"
  - "packages/**/*.json"
  - "packages/**/*.md"
  - "docs/**/*.md"
  - "infra/**/*.ts"
  - "infra/**/*.js"
  - "infra/**/*.ps1"
  - "data/**/*.md"
exclude_patterns:
  - "**/.*"
  - "**/node_modules"
  - "**/dist"
  - "**/build"
  - "**/.next"
  - "**/.turbo"
  - "**/.cocoindex_code"
  - "tmp/**"
  - "logs/**"
  - "backups/**"
  - ".gitnexus/**"
  - ".playwright-mcp/**"
