---
# Woodpecker CI — PMTL_VN
# Self-hosted on VPS. Replaces GitHub Actions billing dependency.
# Runner: woodpecker-agent (Docker runner)
# Docs: https://woodpecker-ci.org/docs

when:
  - event: [push, pull_request]
    branch: [main, develop]

steps:
  # ─── Install ────────────────────────────────────────────────────────────────
  install:
    image: node:20-alpine
    environment:
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN:
        from_secret: TURBO_TOKEN
      TURBO_TEAM:
        from_secret: TURBO_TEAM
      TURBO_API:
        from_secret: TURBO_API
    commands:
      - corepack enable
      - corepack prepare pnpm@10.30.3 --activate
      - pnpm install --frozen-lockfile
    when:
      - event: [push, pull_request]

  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint-typecheck:
    image: node:20-alpine
    depends_on: [install]
    environment:
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN:
        from_secret: TURBO_TOKEN
      TURBO_TEAM:
        from_secret: TURBO_TEAM
      TURBO_API:
        from_secret: TURBO_API
    commands:
      - corepack enable
      - corepack prepare pnpm@10.30.3 --activate
      - pnpm turbo run lint typecheck --cache-dir=.turbo
    when:
      - event: [push, pull_request]

  # ─── Test ────────────────────────────────────────────────────────────────────
  test:
    image: node:20-alpine
    depends_on: [install]
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://pmtl:pmtl@postgres:5432/pmtl_test
      DATABASE_DIRECT_URL: postgresql://pmtl:pmtl@postgres:5432/pmtl_test
      JWT_ACCESS_SECRET: ci-test-access-secret-32chars-min
      JWT_REFRESH_SECRET: ci-test-refresh-secret-32chars-min
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN:
        from_secret: TURBO_TOKEN
      TURBO_TEAM:
        from_secret: TURBO_TEAM
      TURBO_API:
        from_secret: TURBO_API
    commands:
      - corepack enable
      - corepack prepare pnpm@10.30.3 --activate
      - pnpm turbo run test --filter=@pmtl/api --cache-dir=.turbo
    when:
      - event: [push, pull_request]

  # ─── Build Docker Images (main branch only) ──────────────────────────────────
  build-api:
    image: plugins/docker
    depends_on: [lint-typecheck, test]
    settings:
      repo: ghcr.io/${CI_REPO_OWNER}/pmtl-vn-api
      tags:
        - ${CI_COMMIT_SHA}
        - latest
      dockerfile: apps/api/Dockerfile
      context: .
      registry: ghcr.io
      username:
        from_secret: GHCR_USERNAME
      password:
        from_secret: GHCR_TOKEN
    when:
      - event: push
        branch: main

  build-web:
    image: plugins/docker
    depends_on: [lint-typecheck]
    settings:
      repo: ghcr.io/${CI_REPO_OWNER}/pmtl-vn-web
      tags:
        - ${CI_COMMIT_SHA}
        - latest
      dockerfile: apps/web/Dockerfile
      context: .
      registry: ghcr.io
      username:
        from_secret: GHCR_USERNAME
      password:
        from_secret: GHCR_TOKEN
    when:
      - event: push
        branch: main

  build-admin:
    image: plugins/docker
    depends_on: [lint-typecheck]
    settings:
      repo: ghcr.io/${CI_REPO_OWNER}/pmtl-vn-admin
      tags:
        - ${CI_COMMIT_SHA}
        - latest
      dockerfile: apps/admin/Dockerfile
      context: .
      registry: ghcr.io
      username:
        from_secret: GHCR_USERNAME
      password:
        from_secret: GHCR_TOKEN
    when:
      - event: push
        branch: main

  # ─── Security Scan ───────────────────────────────────────────────────────────
  scan-api:
    image: aquasec/trivy
    depends_on: [build-api]
    commands:
      - trivy image --exit-code 1 --severity CRITICAL --no-progress ghcr.io/${CI_REPO_OWNER}/pmtl-vn-api:${CI_COMMIT_SHA}
    when:
      - event: push
        branch: main

  scan-web:
    image: aquasec/trivy
    depends_on: [build-web]
    commands:
      - trivy image --exit-code 1 --severity CRITICAL --no-progress ghcr.io/${CI_REPO_OWNER}/pmtl-vn-web:${CI_COMMIT_SHA}
    when:
      - event: push
        branch: main

  # ─── Sign Images with Cosign ─────────────────────────────────────────────────
  sign-api:
    image: gcr.io/projectsigstore/cosign:v2.4.1
    depends_on: [scan-api]
    environment:
      COSIGN_PASSWORD:
        from_secret: COSIGN_PASSWORD
      COSIGN_PRIVATE_KEY:
        from_secret: COSIGN_PRIVATE_KEY
    commands:
      - echo "$COSIGN_PRIVATE_KEY" > cosign.key
      - cosign sign --key cosign.key --yes ghcr.io/${CI_REPO_OWNER}/pmtl-vn-api:${CI_COMMIT_SHA}
      - rm cosign.key
    when:
      - event: push
        branch: main

  sign-web:
    image: gcr.io/projectsigstore/cosign:v2.4.1
    depends_on: [scan-web]
    environment:
      COSIGN_PASSWORD:
        from_secret: COSIGN_PASSWORD
      COSIGN_PRIVATE_KEY:
        from_secret: COSIGN_PRIVATE_KEY
    commands:
      - echo "$COSIGN_PRIVATE_KEY" > cosign.key
      - cosign sign --key cosign.key --yes ghcr.io/${CI_REPO_OWNER}/pmtl-vn-web:${CI_COMMIT_SHA}
      - rm cosign.key
    when:
      - event: push
        branch: main

  sign-admin:
    image: gcr.io/projectsigstore/cosign:v2.4.1
    depends_on: [build-admin]
    environment:
      COSIGN_PASSWORD:
        from_secret: COSIGN_PASSWORD
      COSIGN_PRIVATE_KEY:
        from_secret: COSIGN_PRIVATE_KEY
    commands:
      - echo "$COSIGN_PRIVATE_KEY" > cosign.key
      - cosign sign --key cosign.key --yes ghcr.io/${CI_REPO_OWNER}/pmtl-vn-admin:${CI_COMMIT_SHA}
      - rm cosign.key
    when:
      - event: push
        branch: main

  # ─── Deploy to VPS (main branch only) ────────────────────────────────────────
  deploy:
    image: appleboy/drone-ssh
    depends_on: [sign-api, sign-web, sign-admin]
    settings:
      host:
        from_secret: VPS_HOST
      username:
        from_secret: VPS_USER
      key:
        from_secret: VPS_SSH_KEY
      script:
        - cd /opt/pmtl
        - export WEB_IMAGE=ghcr.io/${CI_REPO_OWNER}/pmtl-vn-web:${CI_COMMIT_SHA}
        - export API_IMAGE=ghcr.io/${CI_REPO_OWNER}/pmtl-vn-api:${CI_COMMIT_SHA}
        - export ADMIN_IMAGE=ghcr.io/${CI_REPO_OWNER}/pmtl-vn-admin:${CI_COMMIT_SHA}
        - docker compose -f infra/docker/compose.prod.yml pull
        - docker compose -f infra/docker/compose.prod.yml up -d --no-deps --remove-orphans
        - docker compose -f infra/docker/compose.prod.yml exec -T api node -e "require('./dist/main')" || true
        - docker system prune -f --filter "until=24h"
    when:
      - event: push
        branch: main

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pmtl
      POSTGRES_PASSWORD: pmtl
      POSTGRES_DB: pmtl_test
