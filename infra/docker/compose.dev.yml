services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: dev
    env_file:
      - .env.dev
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=2048
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SENTRY_ENABLED: "false"
      SENTRY_ENABLED: "false"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    depends_on:
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: ["sh", "/app/infra/scripts/docker-dev-start.sh", "web"]
    ports:
      - "5173:5173"
    volumes:
      - ../../package.json:/app/package.json:ro
      - ../../pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ../../turbo.json:/app/turbo.json:ro
      - ../../apps/web/src:/app/apps/web/src
      - ../../apps/web/public:/app/apps/web/public
      - ../../apps/web/package.json:/app/apps/web/package.json:ro
      - ../../apps/web/tsconfig.json:/app/apps/web/tsconfig.json:ro
      - ../../apps/web/vitest.config.ts:/app/apps/web/vitest.config.ts:ro
      - ../../apps/web/next-env.d.ts:/app/apps/web/next-env.d.ts
      - ../../apps/web/next.config.ts:/app/apps/web/next.config.ts:ro
      - ../../apps/web/postcss.config.mjs:/app/apps/web/postcss.config.mjs:ro
      - ../../apps/web/tailwind.config.ts:/app/apps/web/tailwind.config.ts:ro
      - ../../apps/web/components.json:/app/apps/web/components.json:ro
      - ../../apps/web/design-tokens.ts:/app/apps/web/design-tokens.ts:ro
      - ../../packages/shared/src:/app/packages/shared/src
      - ../../packages/shared/package.json:/app/packages/shared/package.json:ro
      - ../../packages/ui/src:/app/packages/ui/src
      - ../../packages/ui/package.json:/app/packages/ui/package.json:ro
      - ../../packages/config:/app/packages/config:ro
      - ../../infra/scripts:/app/infra/scripts:ro
      - node-modules:/app/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
      - turbo-cache:/app/.turbo
      - web-next-cache:/app/apps/web/.next
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const socket=require('net').connect(5173,'127.0.0.1');socket.on('connect',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"
        ]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 45s
    init: true
    restart: unless-stopped
    networks:
      - frontend
      - backend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - lock_timeout=5000
      - -c
      - statement_timeout=30000
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
    env_file:
      - .env.dev
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  meilisearch:
    image: getmeili/meilisearch:v1.14
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
      MEILI_SNAPSHOT_DIR: ${MEILI_SNAPSHOT_DIR:-/meili_data/snapshots}
    volumes:
      - meili-dev-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "7700:7700"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "6379:6379"
    networks:
      - backend

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend
      - backend

volumes:
  postgres-dev-data:
  meili-dev-data:
  redis-dev-data:
  caddy-data:
  caddy-config:
  node-modules:
  pnpm-store:
  turbo-cache:
  web-next-cache:

networks:
  frontend:
  backend:
